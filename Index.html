<title>ห้องโครงงาน PBL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: ใบงานช่าง — แถบหัวคงที่ + ราวขั้นตอนด้านซ้าย + พื้นที่ทำงานด้านขวา (มือถือเรียงลงมา) */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --sunk:#E4EAE8; --ink:#13302A; --muted:#566A65; --line:#CCD7D3;
  --accent:#0F6E5F; --accent-ink:#FFFFFF; --accent-soft:#D6EAE5;
  --amber:#A86F00; --amber-soft:#FBEFCF; --danger:#B4412E; --danger-soft:#F7E0DA;
  --ok:#2B7539; --ok-soft:#DDEFDF; --info:#2E5F9E; --info-soft:#DDE7F5;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(19,48,42,.06),0 6px 20px rgba(19,48,42,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1513; --surface:#14201D; --sunk:#0A1110; --ink:#E2ECE9; --muted:#94A7A2; --line:#2A3B37;
  --accent:#52C3AC; --accent-ink:#06221C; --accent-soft:#173A33;
  --amber:#F0BC3C; --amber-soft:#3A2F12; --danger:#F08A75; --danger-soft:#3D1E18;
  --ok:#7FD08C; --ok-soft:#17331C; --info:#8DB4EA; --info-soft:#172A44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1513; --surface:#14201D; --sunk:#0A1110; --ink:#E2ECE9; --muted:#94A7A2; --line:#2A3B37;
  --accent:#52C3AC; --accent-ink:#06221C; --accent-soft:#173A33;
  --amber:#F0BC3C; --amber-soft:#3A2F12; --danger:#F08A75; --danger-soft:#3D1E18;
  --ok:#7FD08C; --ok-soft:#17331C; --info:#8DB4EA; --info-soft:#172A44;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:700}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.12rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.mono{font-family:var(--f-mono);font-size:.9em;letter-spacing:.02em}
.eyebrow{font-family:var(--f-display);font-size:.82rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.spacer{flex:1}

/* topbar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;min-height:60px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.85rem;font-weight:700}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.role-tag{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.busybar{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:40;overflow:hidden}
.busybar::after{content:"";position:absolute;inset:0;width:35%;background:var(--amber);animation:slide 1s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:40px;text-decoration:none;color:var(--ink);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.86rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-height:42px;transition:border-color .15s}
textarea.input{min-height:120px;resize:vertical;line-height:1.6}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.shadow{box-shadow:var(--shadow);border-color:transparent}
.note{border-left:3px solid var(--amber);background:var(--amber-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.92rem}
.note.info{border-color:var(--info);background:var(--info-soft)}
.note.ok{border-color:var(--ok);background:var(--ok-soft)}
.note.danger{border-color:var(--danger);background:var(--danger-soft)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-todo{color:var(--muted);background:var(--sunk)}
.st-doing{color:var(--info);background:var(--info-soft)}
.st-done{color:var(--ok);background:var(--ok-soft)}
.st-submitted,.rv-pending{color:var(--amber);background:var(--amber-soft)}
.rv-approved{color:var(--ok);background:var(--ok-soft)}
.rv-revise{color:var(--danger);background:var(--danger-soft)}
.stamp{font-family:var(--f-display);font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--amber);border:1.5px solid var(--amber);border-radius:4px;padding:0 6px;white-space:nowrap;transform:rotate(-2deg);display:inline-block}
.tag{display:inline-block;font-size:.8rem;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--ink)}
.tag.pbl{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* progress */
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.meter.amber>i{background:var(--amber)}
.pct{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}

/* login */
.login{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:start;padding-block:48px}
.login-intro{display:flex;flex-direction:column;gap:22px;min-width:0}
.lead{font-size:1.05rem;color:var(--muted);max-width:60ch}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.path{border-top:3px solid var(--accent);padding-top:12px;min-width:0}
.path.r{border-color:var(--amber)}
.path ol{margin:8px 0 0;padding-left:1.4em;font-size:.9rem;color:var(--muted)}
.path .big{font-family:var(--f-display);font-size:2.4rem;font-weight:700;line-height:1;color:var(--accent)}
.path.r .big{color:var(--amber)}
.seg{display:flex;background:var(--sunk);padding:4px;border-radius:10px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* onboarding */
.ob{padding-block:32px;display:flex;flex-direction:column;gap:24px}
.ob-steps{display:flex;gap:8px;flex-wrap:wrap;counter-reset:ob}
.ob-steps span{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted);font-size:.9rem;padding:6px 12px 6px 6px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.ob-steps span::before{counter-increment:ob;content:counter(ob);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-family:var(--f-display);font-size:.8rem}
.ob-steps span.on{color:var(--ink);border-color:var(--accent)}
.ob-steps span.on::before{background:var(--accent);color:var(--accent-ink)}
.ob-steps span.ok::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.lesson article{display:flex;flex-direction:column;gap:22px;max-width:70ch}
.lesson section{display:flex;flex-direction:column;gap:8px}
.lesson ul,.lesson ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.compare{width:100%;border-collapse:collapse;font-size:.9rem}
.compare th,.compare td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.compare th{font-family:var(--f-display);font-weight:600;background:var(--sunk)}
.compare td.hl{background:var(--accent-soft)}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.quiz .q{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px dashed var(--line)}
.quiz label{display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:.93rem}
.quiz input{margin-top:5px;accent-color:var(--accent)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.type{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--surface)}
.type:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.type input{margin-top:6px;accent-color:var(--accent)}
.type b{display:block;font-weight:600}
.units{display:flex;flex-direction:column;gap:8px}
.unit{display:grid;grid-template-columns:70px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.toggle{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;white-space:nowrap;cursor:pointer;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.toggle:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.toggle input{accent-color:var(--accent)}
.member{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.pick-list{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.pick{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.pick:last-child{border-bottom:0}
.pick:hover{background:var(--sunk)}
.pick.on{background:var(--accent-soft)}

/* home */
.band{background:var(--surface);border-bottom:1px solid var(--line)}
.band .wrap{padding-block:22px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:end}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.meters{display:flex;flex-direction:column;gap:10px}
.meters .lbl{display:flex;justify-content:space-between;font-size:.86rem;font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:12px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-family:var(--f-display);font-size:.98rem}
.tabs button.on{color:var(--ink);border-color:var(--accent)}
.tabs .count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--amber-soft);color:var(--amber);font-size:.75rem;margin-left:6px}
.work{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;padding-block:24px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:2px}
.rail button{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 8px;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;cursor:pointer;align-items:center}
.rail button:hover{background:var(--surface)}
.rail button.on{background:var(--surface);box-shadow:var(--shadow)}
.rail .n{font-family:var(--f-display);font-weight:700;font-size:1.15rem;color:var(--muted)}
.rail button.on .n{color:var(--accent)}
.rail .t{font-weight:600;font-size:.9rem;line-height:1.35}
.rail .s{grid-column:2;font-size:.76rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.rail .lock{color:var(--amber)}
.step-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.step-no{font-family:var(--f-display);font-weight:700;font-size:3rem;line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.tasks{display:flex;flex-direction:column;gap:10px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task.open{border-color:var(--accent);box-shadow:var(--shadow)}
.task-h{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 16px;cursor:pointer;width:100%;border:0;background:transparent;text-align:left}
.task-h .k{font-family:var(--f-display);font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.task-h .tt{font-weight:600}
.task-h .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.task-b{padding:4px 16px 18px;display:flex;flex-direction:column;gap:14px;border-top:1px dashed var(--line)}
.prompt{background:var(--sunk);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.prompt-h{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--muted)}
.prompt pre{margin:0;padding:12px 14px;white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);font-size:.92rem;line-height:1.7;max-height:360px;overflow:auto}
.ph{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px;font-weight:600}
.ph.filled{background:var(--accent-soft);color:var(--accent)}
.status-pick{display:flex;flex-wrap:wrap;gap:6px}
.status-pick label{cursor:pointer}
.status-pick input{position:absolute;opacity:0;pointer-events:none}
.status-pick span{display:inline-block;padding:6px 12px;border-radius:8px;border:1px solid var(--line);font-size:.86rem;font-weight:600;color:var(--muted)}
.status-pick input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.status-pick input:focus-visible+span{outline:2px solid var(--accent)}
.feedback{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.feedback.revise{border-color:var(--danger);background:var(--danger-soft)}
.feedback.approved{border-color:var(--ok);background:var(--ok-soft)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:4px 12px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.locked{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.worktext{white-space:pre-wrap;word-break:break-word;background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:.92rem;max-height:320px;overflow:auto}

/* teacher/admin lists */
.glist{display:flex;flex-direction:column;gap:10px}
.gitem{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.gitem:hover{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .v{font-family:var(--f-display);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-family:var(--f-display);font-weight:600;font-size:.85rem;color:var(--muted);background:var(--sunk);position:sticky;top:0}
.tbl td.num{font-variant-numeric:tabular-nums}
.review-form{display:flex;flex-direction:column;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.mini-meter{display:flex;align-items:center;gap:8px;font-size:.82rem}
.mini-meter .meter{flex:1;height:6px}
.section{padding-block:24px;display:flex;flex-direction:column;gap:18px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,520px)}
#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:var(--shadow);animation:pop .2s ease-out}
#toast div.err{background:var(--danger);color:#fff}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

@media (max-width:900px){
  .login{grid-template-columns:1fr;padding-block:28px;gap:28px}
  .lesson{grid-template-columns:1fr}
  .band .wrap{grid-template-columns:1fr}
  .work{grid-template-columns:1fr}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .rail button{min-width:200px;background:var(--surface);border:1px solid var(--line)}
  .gitem{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .paths{grid-template-columns:1fr}
  .unit{grid-template-columns:56px minmax(0,1fr);}
  .unit .toggle,.unit .btn{grid-column:auto}
  .task-h{grid-template-columns:40px minmax(0,1fr)}
  .task-h .chips{grid-column:1/-1;justify-content:flex-start}
  .kv{grid-template-columns:1fr}
  .gitem{grid-template-columns:1fr}
  .who-name{max-width:42vw}
  .brand span.full,.role-tag{display:none}
  .topbar .btn{white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="busy" class="busybar" hidden></div>
<div id="app"></div>
<div id="toast" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<!--TEST_HOOK-->

<script>
/* ======================== เนื้อหาตามคู่มือ ======================== */

const API_URL=String(window.PBL_API_URL||'').trim();
const IN_GAS=!!(window.google&&google.script&&google.script.run);
function call(action,payload){
  return new Promise((resolve,reject)=>{
    busy(true);
    const done=r=>{busy(false); if(r&&r.ok) resolve(r.data); else { const m=(r&&r.error)||'เกิดข้อผิดพลาด'; if(m.indexOf('SESSION:')===0){ logoutLocal(); toast(m.slice(8).trim(),true); } reject(new Error(m.replace(/^SESSION:\s*/,''))); } };
    if(window.google&&google.script&&google.script.run){
      google.script.run.withSuccessHandler(done).withFailureHandler(e=>{busy(false);reject(new Error(e&&e.message||'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้'))}).api(action,payload||{},S.token);
    } else if(window.PBL_TEST_SERVER){
      setTimeout(()=>done(window.PBL_TEST_SERVER.api(action,payload||{},S.token)),30);
    } else if(API_URL){
      fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,payload:payload||{},token:S.token}),redirect:'follow'})
        .then(r=>r.json()).then(done)
        .catch(()=>{busy(false);reject(new Error('เชื่อมต่อฐานข้อมูลไม่ได้ ตรวจสอบอินเทอร์เน็ต หรือ URL ของ Apps Script ใน config.js'))});
    } else { busy(false); reject(new Error('ยังไม่ได้เชื่อมต่อฐานข้อมูล: ใส่ URL ของ Apps Script ในไฟล์ docs/config.js')); }
  });
}
let busyN=0;
function busy(on){busyN+=on?1:-1; if(busyN<0)busyN=0; document.getElementById('busy').hidden=busyN===0}
function toast(msg,err){const t=document.getElementById('toast');const d=document.createElement('div');if(err)d.className='err';d.textContent=msg;t.appendChild(d);setTimeout(()=>d.remove(),err?5000:2600)}
const e=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const val=id=>{const el=$(id);return el?el.value.trim():''};
function act(fn){return fn().catch(err=>toast(err.message,true))}

/* ======================== routing ======================== */
function render(){
  const app=$('app');
  let html='';
  if(S.view==='login') html=viewLogin();
  else html=topbar()+(
    S.view==='onboard'?viewOnboard():
    S.view==='student'?viewStudent():
    S.view==='teacher'?viewTeacher():
    S.view==='admin'?viewAdmin():'');
  app.innerHTML=html;
  afterRender();
}
function afterRender(){
  document.querySelectorAll('textarea[data-draft]').forEach(t=>{t.addEventListener('input',()=>{S.drafts[t.dataset.draft]=Object.assign(S.drafts[t.dataset.draft]||{},{work:t.value})})});
  document.querySelectorAll('input[data-draftlink]').forEach(t=>{t.addEventListener('input',()=>{S.drafts[t.dataset.draftlink]=Object.assign(S.drafts[t.dataset.draftlink]||{},{link:t.value})})});
}
function logoutLocal(){S.token='';S.role='';S.data=null;S.view='login';S.drafts={};S.tGroup=null;store.set('pbl3_token','');render()}

async function routeStudent(data){
  S.data=data; S.role='student';
  const b=data.bundle;
  if(!b){ S.view='onboard'; if(['lesson','quiz','setup'].indexOf(S.ob)<0) S.ob='lesson'; if(store.get('pbl3_lesson')&&S.ob!=='setup') S.ob='setup'; }
  else if(!b.group.teacher_id){ S.view='onboard'; S.ob='team'; }
  else if(S.view!=='student'){ S.view='student'; pickDefaultStep(); }
  render();
}
async function boot(){
  const t=store.get('pbl3_token');
  if(!t){render();return}
  S.token=t;
  try{
    const sess=await call('whoami');
    S.role=sess.role;
    if(sess.role==='student') routeStudent(await call('me'));
    else if(sess.role==='teacher'){S.data=await call('teacherHome');S.view='teacher';render()}
    else if(sess.role==='admin'){S.data=await call('adminOverview');S.view='admin';render()}
  }catch(err){logoutLocal()}
}

/* ======================== student home ======================== */
function pmap(progress){const m={};(progress||[]).forEach(r=>m[r.track+'-'+r.step+'-'+r.sub]=r);return m}
function gateOf(step,map){
  const s=P_STEPS[step-1]; if(!s.gate) return '';
  const r=map['P-'+s.gate.step+'-'+s.gate.sub];
  if(r&&r.review_status==='approved') return '';
  return 'ต้องให้ครูอนุมัติขั้น '+s.gate.step+'.'+s.gate.sub+' ก่อน';
}
function pickDefaultStep(){
  const m=pmap(S.data.bundle.progress);
  for(const s of P_STEPS){ if(gateOf(s.no,m)) {S.step=Math.max(1,s.no-1);return} const all=s.subs.every((_,i)=>{const r=m['P-'+s.no+'-'+(i+1)];return r&&(r.status==='done'||r.status==='submitted')}); if(!all){S.step=s.no;return} }
  S.step=6;
}
function fillVars(){
  const b=S.data?.bundle||S.tGroup; if(!b) return {};
  const g=b.group, me=(S.role==='student'&&S.data?S.data.me:b.members[0])||{};
  const pbl=(g.units||[]).filter(u=>u.pbl).map(u=>'หน่วยที่ '+u.no+' '+u.name).join(', ');
  return {'ชื่อโครงงาน':g.project_name,'ประเภทโครงงาน':g.project_type?('โครงงาน'+g.project_type):'','รายวิชา':[g.subject_code,g.subject_name].filter(Boolean).join(' '),
    'หน่วยการเรียนรู้':pbl,'ระดับชั้น':me.level,'สาขาวิชา':me.department,'จำนวนสมาชิก':String(b.members.length),'รายชื่อสมาชิก':b.members.map(m=>m.name).join(', ')};
}
function promptHTML(text){
  const v=fillVars();
  return e(text).replace(/\[([^\]]+)\]/g,(m,k)=>{const x=v[k]; return x?`<span class="ph filled">${e(x)}</span>`:`<span class="ph">[${k}]</span>`});
}
function promptText(text){const v=fillVars();return text.replace(/\[([^\]]+)\]/g,(m,k)=>v[k]||m)}
function statusChips(r,cp){
  let h='';
  const st=r?r.status:'todo';
  if(r&&r.review_status) h+=`<span class="chip rv-${r.review_status}">${REVIEW[r.review_status]}</span>`;
  else h+=`<span class="chip st-${st}">${STATUS[st]}</span>`;
  if(cp) h+=`<span class="stamp">ครูตรวจ</span>`;
  return h;
}

function railP(b,teacher){
  const m=pmap(b.progress), cur=teacher?S.tStep:S.step;
  return `<nav class="rail">${P_STEPS.map(s=>{
    const done=s.subs.filter((_,i)=>{const r=m['P-'+s.no+'-'+(i+1)];return r&&(r.status==='done'||r.status==='submitted')}).length;
    const pend=s.subs.filter((_,i)=>{const r=m['P-'+s.no+'-'+(i+1)];return r&&r.review_status==='pending'}).length;
    const lock=gateOf(s.no,m);
    return `<button class="${cur===s.no?'on':''}" data-a="${teacher?'tstep':'step'}" data-v="${s.no}"><span class="n">${s.no}</span><span class="t">${e(s.title)}</span>
      <span class="s">${done}/${s.subs.length} เสร็จ ${pend?`<span class="chip rv-pending">รอตรวจ ${pend}</span>`:''} ${lock?'<span class="lock">· ล็อก</span>':''}</span></button>`}).join('')}</nav>`;
}
function viewTrackP(b,teacher){
  const m=pmap(b.progress), cur=teacher?S.tStep:S.step, s=P_STEPS[cur-1];

const DOCX={
  W:'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"',
  TEXT_W:8306,
  x(s){return String(s==null?'':s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F￾￿]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')},
  runs(text,o){o=o||{};return String(text).split(/(\*\*[^*]+\*\*)/g).filter(p=>p!=='').map(p=>{const bold=/^\*\*[^*]+\*\*$/.test(p);const t=bold?p.slice(2,-2):p;
    const rpr=(bold||o.b?'<w:b/><w:bCs/>':'')+(o.sz?`<w:sz w:val="${o.sz}"/><w:szCs w:val="${o.sz}"/>`:'');
    return `<w:r>${rpr?`<w:rPr>${rpr}</w:rPr>`:''}<w:t xml:space="preserve">${DOCX.x(t)}</w:t></w:r>`}).join('')},
  p(text,o){o=o||{};let ppr='';if(o.style)ppr+=`<w:pStyle w:val="${o.style}"/>`;if(o.pb)ppr+='<w:pageBreakBefore/>';if(o.jc)ppr+=`<w:jc w:val="${o.jc}"/>`;
    return `<w:p>${ppr?`<w:pPr>${ppr}</w:pPr>`:''}${text?DOCX.runs(text,o):''}</w:p>`},
  blank(n){return Array.from({length:n},()=>'<w:p/>').join('')},
  h1(lines,pb){return `<w:p><w:pPr><w:pStyle w:val="Heading1"/>${pb?'<w:pageBreakBefore/>':''}</w:pPr>${lines.map((l,i)=>(i?'<w:r><w:br/></w:r>':'')+`<w:r><w:t xml:space="preserve">${DOCX.x(l)}</w:t></w:r>`).join('')}</w:p>`},
  table(rows){const n=Math.max.apply(null,rows.map(r=>r.length));const w=Math.floor(DOCX.TEXT_W/n);
    return `<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="${w*n}" w:type="dxa"/><w:jc w:val="center"/></w:tblPr><w:tblGrid>${'<w:gridCol w:w="'+w+'"/>'.repeat(n)}</w:tblGrid>`+
      rows.map((r,ri)=>`<w:tr>${ri===0?'<w:trPr><w:tblHeader/></w:trPr>':''}${Array.from({length:n},(_,ci)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/></w:tcPr>${DOCX.p(r[ci]||'',{style:'TableText',jc:ri===0?'center':null,b:ri===0})}</w:tc>`).join('')}</w:tr>`).join('')+'</w:tbl><w:p/>'},
  md(text,kind){
    const lines=String(text||'').replace(/\r/g,'').split('\n');let out='',i=0;
    while(i<lines.length){
      const t=lines[i].trim();
      if(!t){i++;continue}
      if(t.charAt(0)==='|'){const rows=[];while(i<lines.length&&lines[i].trim().charAt(0)==='|'){const r=lines[i].trim();if(r.replace(/[|:\-\s]/g,'')!=='')rows.push(r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));i++}if(rows.length)out+=DOCX.table(rows);continue}
      i++;
      const clean=t.replace(/^>\s*/,'');
      const hm=clean.match(/^(#{1,6})\s+(.*)$/);
      if(hm){out+=DOCX.p(hm[2].replace(/\*\*/g,''),{style:hm[1].length>=3?'Heading3':'Heading2'});continue}
      if(kind==='biblio'){out+=DOCX.p(clean.replace(/^[-*•]\s+|^\d+[.)]\s+/,''),{style:'Biblio'});continue}
      if(clean.length<90&&/^\d+\.\d+\.\d+\s+\S/.test(clean)){out+=DOCX.p(clean.replace(/\*\*/g,''),{style:'Heading3'});continue}
      if(clean.length<90&&/^\d+\.\d+\s+\S/.test(clean)){out+=DOCX.p(clean.replace(/\*\*/g,''),{style:'Heading2'});continue}
      const bm=clean.match(/^[-*•]\s+(.*)$/);
      if(bm){out+=DOCX.p('•\t'+bm[1],{style:'ListBody'});continue}
      if(/^\d+[.)]\s+/.test(clean)){out+=DOCX.p(clean.replace(/^(\d+)[.)]\s+/,'$1.\t'),{style:'ListBody'});continue}
      out+=DOCX.p(clean,{style:'Body'});
    }
    return out;
  },
  sect(o){return `<w:sectPr><w:headerReference w:type="default" r:id="rIdH1"/>${o.titlePg?'<w:headerReference w:type="first" r:id="rIdH2"/>':''}<w:type w:val="nextPage"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="2160" w:right="1440" w:bottom="1440" w:left="2160" w:header="720" w:footer="720" w:gutter="0"/><w:pgNumType w:fmt="${o.fmt}" w:start="1"/>${o.titlePg?'<w:titlePg/>':''}</w:sectPr>`},
  styles(){

    const B='<w:b/><w:bCs/>', SZ=n=>`<w:sz w:val="${n}"/><w:szCs w:val="${n}"/>`, bd=k=>`<w:${k} w:val="single" w:sz="4" w:space="0" w:color="000000"/>`;
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles ${DOCX.W}>
<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="${F}" w:hAnsi="${F}" w:eastAsia="${F}" w:cs="${F}"/>${SZ(32)}<w:lang w:val="th-TH" w:eastAsia="en-US" w:bidi="th-TH"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>
${ps('Heading1','heading 1','<w:keepNext/><w:spacing w:after="360"/><w:jc w:val="center"/><w:outlineLvl w:val="0"/>',B+SZ(40),'<w:next w:val="Body"/>')}
${ps('Heading2','heading 2','<w:keepNext/><w:spacing w:before="240" w:after="60"/><w:outlineLvl w:val="1"/>',B+SZ(36),'<w:next w:val="Body"/>')}
${ps('Heading3','heading 3','<w:keepNext/><w:spacing w:before="120" w:after="0"/><w:ind w:left="360"/><w:outlineLvl w:val="2"/>',B+SZ(32),'<w:next w:val="Body"/>')}
${ps('Body','Body Text Thai','<w:ind w:firstLine="720"/><w:jc w:val="thaiDistribute"/>','')}
${ps('ListBody','List Thai','<w:tabs><w:tab w:val="left" w:pos="1080"/></w:tabs><w:ind w:left="1080" w:hanging="360"/>','')}
${ps('Biblio','Bibliography Thai','<w:ind w:left="720" w:hanging="720"/>','')}
${ps('TableText','Table Text Thai','','')}
${ps('CoverTitle','Cover Title','<w:jc w:val="center"/>',B+SZ(44))}
${ps('TocTitle','TOC Title','<w:spacing w:after="360"/><w:jc w:val="center"/>',B+SZ(40))}
${ps('TOC1','toc 1','<w:tabs><w:tab w:val="right" w:leader="dot" w:pos="8296"/></w:tabs><w:spacing w:before="60"/>','')}

<w:style w:type="table" w:styleId="TableGrid"><w:name w:val="Table Grid"/><w:tblPr><w:tblBorders>${bd('top')}${bd('left')}${bd('bottom')}${bd('right')}${bd('insideH')}${bd('insideV')}</w:tblBorders><w:tblCellMar><w:left w:w="108" w:type="dxa"/><w:right w:w="108" w:type="dxa"/></w:tblCellMar></w:tblPr></w:style>
</w:styles>`;

};
function buildDocument(b){
  const m=pmap(b.progress), info=docInfo(b), g=b.group, st=docStatus(b), D=DOCX;
  const get=id=>{const r=m['D-'+id+'-0'];return r&&r.work&&r.work.trim()?r.work:''};
  const fill=t=>t.replace(/\[ชื่อโครงงาน\]/g,g.project_name||'').replace(/\[ครูที่ปรึกษา\]/g,b.teacher?b.teacher.name:'ครูที่ปรึกษา');
  const missing=t=>D.p(`[ยังไม่ได้เขียน${t}]`,{style:'Body'});
  const year=info.year||defaultYear(), term=info.term||defaultTerm();
  const subject=[g.subject_code,g.subject_name].filter(Boolean).join(' ');
  const C=(t,o)=>D.p(t,Object.assign({jc:'center'},o||{}));
  let x='';
  // ปก
  x+=D.blank(1)+C(g.project_name||'ชื่อโครงงาน',{style:'CoverTitle'})+(st.complete?'':C('(ฉบับร่าง)'))+D.blank(3);
  x+=C('จัดทำโดย',{b:true})+b.members.map(mb=>C(`${mb.name}  รหัสนักศึกษา ${mb.student_id}`)).join('')+D.blank(2);
  x+=C('ครูที่ปรึกษา',{b:true})+C(b.teacher?b.teacher.name:'-')+D.blank(Math.max(1,5-b.members.length));
  x+=C(`รายงานนี้เป็นส่วนหนึ่งของรายวิชา ${subject}`)+(info.dept?C(info.dept):'')+(info.college?C(info.college):'')+C(`ภาคเรียนที่ ${term} ปีการศึกษา ${year}`);
  // บทคัดย่อ
  x+=D.h1(['บทคัดย่อ'],true);
  x+=D.p(`**ชื่อโครงงาน:** ${g.project_name||'-'}`)+D.p(`**ผู้จัดทำ:** ${b.members.map(mb=>mb.name).join(', ')}`)+D.p(`**ครูที่ปรึกษา:** ${b.teacher?b.teacher.name:'-'}`)+D.p(`**รายวิชา:** ${subject||'-'}`)+D.p(`**ปีการศึกษา:** ${year}`)+'<w:p/>';
  x+=get(1)?D.md(get(1),'body'):missing('บทคัดย่อ');
  // กิตติกรรมประกาศ
  x+=D.h1(['กิตติกรรมประกาศ'],true)+(get(2)?D.md(fill(get(2)),'body'):missing('กิตติกรรมประกาศ'))+'<w:p/>'+D.p('คณะผู้จัดทำ',{jc:'right'});
  // สารบัญ (Word สร้างให้เมื่อเปิดไฟล์)
  x+=D.p('สารบัญ',{style:'TocTitle',pb:true});
  x+=`<w:p><w:r><w:fldChar w:fldCharType="begin" w:dirty="true"/></w:r><w:r><w:instrText xml:space="preserve"> TOC \\o "1-2" \\h \\z \\u </w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:t xml:space="preserve">เปิดไฟล์ใน Word แล้วกด “ใช่” เพื่ออัปเดตสารบัญ หรือคลิกขวาที่ข้อความนี้ แล้วเลือก “อัปเดตเขตข้อมูล”</w:t></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r></w:p>`;
  x+=`<w:p><w:pPr>${D.sect({fmt:'thaiLetters',titlePg:true})}</w:pPr></w:p>`;
  // บทที่ 1–5
  DOC_SECTIONS.filter(s=>s.chapter).forEach((s,i)=>{x+=D.h1([`บทที่ ${s.chapter}`,s.title],i>0)+(get(s.id)?D.md(get(s.id),'body'):missing(` บทที่ ${s.chapter}`))});
  x+=D.h1(['บรรณานุกรม'],true)+(get(8)?D.md(get(8),'biblio'):missing('บรรณานุกรม'));
  if(get(9)) x+=D.h1(['ภาคผนวก'],true)+D.md(get(9),'body');
  const body=x+D.sect({fmt:'decimal',titlePg:false});
  return {xml:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${D.W}><w:body>${body}</w:body></w:document>`,complete:st.complete};
}
async function exportDocx(b){

  zip.file('[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/settings.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.settings+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/header2.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>`);
  zip.file('_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>`);
  zip.file('word/_rels/document.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdS" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rIdSet" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/settings" Target="settings.xml"/><Relationship Id="rIdH1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/><Relationship Id="rIdH2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header2.xml"/></Relationships>`);
  zip.file('word/document.xml',doc.xml);
  zip.file('word/styles.xml',D.styles());
  zip.file('word/settings.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:settings ${D.W}><w:defaultTabStop w:val="720"/><w:updateFields w:val="true"/><w:compat><w:compatSetting w:name="compatibilityMode" w:uri="http://schemas.microsoft.com/office/word" w:val="15"/></w:compat><w:themeFontLang w:val="en-US" w:bidi="th-TH"/></w:settings>`);
  zip.file('word/header1.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr ${D.W}><w:p><w:pPr><w:jc w:val="right"/></w:pPr><w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:instrText xml:space="preserve"> PAGE </w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:t>1</w:t></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r></w:p></w:hdr>`);
  zip.file('word/header2.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr ${D.W}><w:p/></w:hdr>`);
  zip.file('docProps/core.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>${D.x(g.project_name||'รายงานโครงงาน')}</dc:title><dc:creator>${D.x(b.members.map(mb=>mb.name).join(', '))}</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created><dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified></cp:coreProperties>`);

     <textarea class="input mono" id="imData" style="min-height:200px" placeholder="66201010010	นายสมชาย ใจกล้า	0891112222	ปวช.3	ช่างไฟฟ้า"></textarea>

     <div class="card stack"><h3>เปลี่ยนรหัสผู้ดูแล</h3><div class="field"><label for="pwOld">รหัสเดิม</label><input class="input" type="password" id="pwOld" autocomplete="current-password"></div><div class="field"><label for="pwNew">รหัสใหม่ (อย่างน้อย 8 ตัวอักษร)</label><input class="input" type="password" id="pwNew" autocomplete="new-password"></div><div><button class="btn primary" data-a="apw">เปลี่ยนรหัส</button></div></div></div>`;

function parseRows(text,table){
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const c=(l.includes('\t')?l.split('\t'):l.split(',')).map(x=>x.trim());
    return table==='students'?{student_id:c[0],name:c[1],phone:c[2],level:c[3],department:c[4]}:{teacher_id:c[0],name:c[1],phone:c[2],department:c[3]}});
}

/* ======================== events ======================== */
const armed={};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, v=el.dataset.v;
  if(el.tagName==='INPUT'&&el.type!=='radio'&&el.type!=='checkbox') return;
  const H=HANDLERS[a]; if(H){ if(el.tagName==='BUTTON'||el.classList.contains('pick')) ev.preventDefault(); H(el,v); }
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Enter'){
    if(ev.target.id==='loginId') HANDLERS.login();
    else if(ev.target.id==='adminPw') HANDLERS.loginAdmin();
    else if(ev.target.id==='mId') HANDLERS.lookup();
    else if(ev.target.classList.contains('pick')) ev.target.click();
  }
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='tFilter'){S.tFilter=ev.target.value;const pos=ev.target.selectionStart;render();const t=$('tFilter');t.focus();t.setSelectionRange(pos,pos)}
  if(ev.target.id==='adminQ'){S.adminQ=ev.target.value;const pos=ev.target.selectionStart;render();const t=$('adminQ');t.focus();t.setSelectionRange(pos,pos)}
});
function keepUnits(){ if(S.units&&$('uNo0')) S.units=collectUnits(); }
const HANDLERS={
  ltab(el,v){S.loginTab=v;S.reg=null;render();setTimeout(()=>{const i=$('loginId')||$('adminPw');i&&i.focus()},0)},
  cancelReg(){S.reg=null;render()},
  login(){
    const id=val('loginId'); if(!id){toast('กรุณากรอกรหัส',true);return}
    const isT=S.loginTab==='teacher';
    act(async()=>{
      const r=await call(isT?'loginTeacher':'loginStudent',isT?{teacher_id:id}:{student_id:id});
      if(r.needRegister){S.reg=id;render();setTimeout(()=>$('rgName')&&$('rgName').focus(),0);return}
      await afterLogin(r);
    });
  },
  register(){
    const isT=S.loginTab==='teacher';
    const p=isT?{teacher_id:S.reg,name:val('rgName'),phone:val('rgPhone'),department:val('rgDept')}:{student_id:S.reg,name:val('rgName'),phone:val('rgPhone'),level:val('rgLevel'),department:val('rgDept')};
    act(async()=>{const r=await call(isT?'registerTeacher':'registerStudent',p);toast('ลงทะเบียนเรียบร้อย');await afterLogin(r)});
  },
  loginAdmin(){act(async()=>{const r=await call('loginAdmin',{password:$('adminPw').value});S.defaultPw=r.defaultPassword;await afterLogin(r)})},
  logout(){const t=S.token;call('logout').catch(()=>{});store.set('pbl3_lesson','');S.units=null;S.ob='lesson';S.quiz={};logoutLocal()},
  quiz(el){S.quiz[+el.dataset.q]=+el.dataset.v; if(S.ob==='quiz'){render()} else { const answered=QUIZ.every((_,i)=>S.quiz[i]!=null); const b=document.querySelector('[data-a="checkQuiz"]'); if(b) b.disabled=!answered; }},
  checkQuiz(){
    const ok=QUIZ.every((q,i)=>S.quiz[i]===q.c);
    if(S.ob==='quiz'&&ok){store.set('pbl3_lesson','1');S.ob='setup';render();window.scrollTo(0,0);return}
    S.ob='quiz';render(); toast(ok?'ตอบถูกทุกข้อ ไปขั้นถัดไปได้':'ยังมีข้อที่ไม่ถูก',!ok);
  },
  addUnit(){keepUnits();S.units.push({no:String(S.units.length+1),name:'',pbl:false});render()},
  delUnit(el){keepUnits();S.units.splice(+el.dataset.i,1);if(!S.units.length)S.units.push({no:'1',name:'',pbl:false});render()},
  saveSetup(){
    keepUnits();
    const type=(document.querySelector('input[name="ptype"]:checked')||{}).value;
    if(!type){toast('กรุณาเลือกประเภทโครงงาน',true);return}
    const units=S.units.filter(u=>u.name);
    if(!units.some(u=>u.pbl)){toast('เลือกหน่วยที่จัดแบบโครงงานอย่างน้อย 1 หน่วย',true);return}
    const p={project_type:type,project_name:val('pName'),subject_code:val('sCode'),subject_name:val('sName'),units,lesson_done:true};
    act(async()=>{const d=await call('saveSetup',p);toast('บันทึกข้อมูลโครงงานแล้ว');S.units=null;if(S.view==='onboard'){S.ob='team';S.data=d;render();window.scrollTo(0,0)}else{S.data=d;render()}});
  },
  lookup(){const id=val('mId');if(!id)return;act(async()=>{const r=await call('lookupStudent',{student_id:id});S.lookup=Object.assign({id},r);render();setTimeout(()=>$('mName')&&$('mName').focus(),0)})},
  addMember(){const lk=S.lookup;if(!lk)return;act(async()=>{S.data=await call('addMember',{student_id:lk.id,name:val('mName'),phone:val('mPhone')});S.lookup=null;toast('เพิ่มสมาชิกแล้ว');render()})},
  removeMember(el,v){if(!arm(el))return;act(async()=>{S.data=await call('removeMember',{student_id:v});toast('นำสมาชิกออกแล้ว');render()})},
  pickTeacher(el,v){act(async()=>{S.data=await call('saveSetup',{teacher_id:v});toast('เลือกครูผู้สอนแล้ว');render()})},
  toggleAddTeacher(){S.showAddTeacher=!S.showAddTeacher;render()},
  addTeacher(){act(async()=>{S.data=await call('addTeacher',{teacher_id:val('ntId'),name:val('ntName'),phone:val('ntPhone'),department:val('ntDept')});S.showAddTeacher=false;toast('เพิ่มครูและเลือกเป็นครูผู้สอนแล้ว');render()})},
  enterRoom(){S.view='student';S.tab='P';pickDefaultStep();render();window.scrollTo(0,0)},
  tab(el,v){keepUnits();S.tab=v;S.units=null;S.lookup=null;render()},
  step(el,v){S.step=+v;S.open='';render();scrollToWork()},
  open(el){const k=el.dataset.k;S.open=S.open===k?'':k;render();if(S.open)$('task-'+k).scrollIntoView({block:'nearest'})},
  copy(el){
    const [track,step,sub]=el.dataset.k.split('-');
    const src=track==='P'?P_STEPS[step-1].subs[sub-1].p:R_STEPS[step-1].p;
    const text=promptText(src);
    const fallback=()=>{const r=document.createRange();r.selectNodeContents($('pr-'+el.dataset.k));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('เลือกข้อความแล้ว กด Ctrl+C / คัดลอก')};
    try{navigator.clipboard.writeText(text).then(()=>toast('คัดลอก Prompt แล้ว นำไปวางใน AI ได้เลย'),fallback)}catch(err){fallback()}
  },
  saveTask(el){
    const k=el.dataset.k,[track,step,sub]=k.split('-');
    const st=(document.querySelector(`input[name="s-${k}"]:checked`)||{}).value||'doing';
    const p={track,step,sub,status:st,work:$('w-'+k).value,link:$('l-'+k).value.trim()};
    if(p.link&&!/^https?:\/\//i.test(p.link)){toast('ลิงก์ต้องขึ้นต้นด้วย https://',true);return}
    act(async()=>{S.data=await call('saveProgress',p);delete S.drafts[k];toast(st==='submitted'?'ส่งครูตรวจแล้ว':'บันทึกแล้ว');render()});
  },
  /* เล่มรายงาน */
  dopen(el){const k=el.dataset.k;S.dOpen=S.dOpen===k?'':k;render();if(S.dOpen)$('task-'+k).scrollIntoView({block:'nearest'})},
  dtpl(el){const k=el.dataset.k,ta=$('w-'+k),sec=DOC_SECTIONS[+k.split('-')[1]-1];
    if(ta.value.trim()){toast('ช่องนี้มีข้อความแล้ว ลบข้อความเดิมก่อนถ้าต้องการใส่หัวข้อมาตรฐาน',true);return}
    ta.value=sec.tpl;S.drafts[k]={work:ta.value};updCount(k);ta.focus()},
  dpull(el){const k=el.dataset.k,ta=$('w-'+k),r=pmap(S.data.bundle.progress)['R-'+el.dataset.v+'-0'];
    if(!r||!r.work.trim()){toast('ขั้นที่ '+el.dataset.v+' ยังไม่มีข้อความบันทึกไว้',true);return}
    ta.value=(ta.value.trim()?ta.value.replace(/\s+$/,'')+'\n\n':'')+r.work;S.drafts[k]={work:ta.value};updCount(k);toast('ดึงข้อความแล้ว ตรวจและแก้ไขก่อนบันทึก')},
  dsave(el){const k=el.dataset.k,[,step]=k.split('-'),work=$('w-'+k).value;
    if(work.length>45000){toast('ข้อความยาวเกิน 45,000 ตัวอักษร',true);return}
    act(async()=>{S.data=await call('saveProgress',{track:'D',step,sub:'0',status:work.trim()?'done':'doing',work,link:''});delete S.drafts[k];toast('บันทึกแล้ว');render()})},
  dinfo(){const info={college:val('dCollege'),dept:val('dDept'),term:$('dTerm').value,year:val('dYear')};
    act(async()=>{S.data=await call('saveProgress',{track:'D',step:'0',sub:'0',status:'done',work:JSON.stringify(info),link:''});toast('บันทึกข้อมูลหน้าปกแล้ว');render()})},
  ddownload(){const b=S.role==='student'?S.data.bundle:S.tGroup;if(!b)return;
    const unsaved=Object.keys(S.drafts).filter(k=>k.indexOf('D-')===0);
    if(unsaved.length&&S.role==='student') toast('มีส่วนที่ยังไม่ได้กดบันทึก ไฟล์จะใช้ข้อความที่บันทึกไว้ล่าสุด',true);
    exportDocx(b).catch(err=>toast('สร้างไฟล์ไม่สำเร็จ: '+err.message,true))},

  topen(el){const k=el.dataset.k;S.tOpen=S.tOpen===k?'':k;render()},

    const k=el.dataset.k,[track,step,sub]=k.split('-');

    if(!rs){toast('เลือกผลการตรวจก่อน',true);return}

  agView(el,v){HANDLERS.tgroup(el,v)},
  agSave(el,v){act(async()=>{S.data=await call('adminSaveRecord',{table:'groups',record:{group_id:v,project_name:val('gn-'+v),teacher_id:$('gt-'+v).value}});toast('บันทึกกลุ่มแล้ว');render()})},
  adel(el){if(!arm(el))return;act(async()=>{S.data=await call('adminDeleteRecord',{table:el.dataset.t,id:el.dataset.v});toast('ลบแล้ว');render()})},
  aedit(el){const isS=el.dataset.t==='students';const r=(isS?S.data.students:S.data.teachers).find(x=>(isS?x.student_id:x.teacher_id)===el.dataset.v);if(!r)return;
    $('ar-id').value=el.dataset.v;$('ar-name').value=r.name;$('ar-phone').value=r.phone;$('ar-dept').value=r.department||'';if(isS)$('ar-level').value=r.level||'';window.scrollTo({top:0,behavior:'smooth'})},
  asave(el){const isS=el.dataset.t==='students';const rec=isS?{student_id:val('ar-id'),name:val('ar-name'),phone:val('ar-phone'),level:val('ar-level'),department:val('ar-dept')}:{teacher_id:val('ar-id'),name:val('ar-name'),phone:val('ar-phone'),department:val('ar-dept')};
    act(async()=>{S.data=await call('adminSaveRecord',{table:el.dataset.t,record:rec});toast('บันทึกแล้ว');render()})},
  aimport(){const t=$('imT').value,rows=parseRows($('imData').value,t);if(!rows.length){toast('ยังไม่มีข้อมูลให้นำเข้า',true);return}
    act(async()=>{const r=await call('adminImport',{table:t,rows});S.data=r.overview;render();S.adminTab='import';render();
      $('imResult').innerHTML=`<div class="note ${r.errors.length?'':'ok'}">เพิ่มใหม่ ${r.added} รายการ · อัปเดต ${r.updated} รายการ${r.errors.length?'<br>'+r.errors.map(e).join('<br>'):''}</div>`})},
  asetting(){act(async()=>{S.data=await call('adminSetSetting',{max_members:val('setMax')});toast('บันทึกการตั้งค่าแล้ว');render()})},
  apw(){act(async()=>{await call('adminSetPassword',{old:$('pwOld').value,next:$('pwNew').value});S.defaultPw=false;toast('เปลี่ยนรหัสผู้ดูแลแล้ว');$('pwOld').value='';$('pwNew').value=''})}
};
function updCount(k){const c=$('cnt-'+k),t=$('w-'+k);if(c&&t)c.textContent=t.value.length.toLocaleString()+' / 45,000 ตัวอักษร'}
document.addEventListener('input',ev=>{const k=ev.target.dataset&&ev.target.dataset.draft;if(k&&k.indexOf('D-')===0)updCount(k)});
function arm(el){const k=el.dataset.a+(el.dataset.v||'');if(armed[k]){delete armed[k];return true}armed[k]=1;el.classList.add('armed');const old=el.textContent;el.textContent='กดอีกครั้งเพื่อยืนยัน';setTimeout(()=>{delete armed[k];if(el.isConnected){el.classList.remove('armed');el.textContent=old}},3500);return false}
function scrollToWork(){const w=document.querySelector('.work section');if(w&&window.innerWidth<900)w.scrollIntoView({block:'start'})}
function firstPendingStep(b){const r=b.progress.find(x=>x.track==='P'&&x.review_status==='pending');return r?+r.step:1}
async function afterLogin(r){
  S.token=r.token;S.role=r.role;store.set('pbl3_token',r.token);S.reg=null;
  if(r.role==='student'){S.view='';await routeStudent(await call('me'))}
  else if(r.role==='teacher'){S.data=await call('teacherHome');S.view='teacher';render()}
  else {S.data=await call('adminOverview');S.view='admin';S.adminTab='overview';render()}
  window.scrollTo(0,0);
}
boot();
</script>
